<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Masterset Tracker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0b1f33; color: #eef3f8; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { max-width: 560px; margin: 0 auto; min-height: 100vh; }
button { font-family: inherit; }
a { color: #7cc4ff; }

/* header */
.topbar { position: sticky; top: 0; z-index: 20; background: #0b1f33; padding: 14px 14px 10px; border-bottom: 1px solid #1d3a57; }
.topbar h1 { font-size: 22px; letter-spacing: .5px; }
.topbar h1 span { color: #e3350d; }
.topbar .sub { font-size: 12px; color: #9db4c8; margin-top: 2px; }
.backbtn { background: #1d3a57; color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-bottom: 8px; }
.backbtn:active { background: #2a4d70; }

/* home — binders look like binders */
.home { padding: 14px; }
.scanbtn { width: 100%; border: none; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 700; background: #e3350d; color: #fff; margin-bottom: 12px; }
.scanbtn:active { background: #b92a0b; }
.scanbtn.ghost { background: #1d3a57; }
.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.binder-card { background: #132a44; border: 1px solid #1d3a57; border-radius: 12px; overflow: hidden; display: flex; min-height: 240px; box-shadow: 0 3px 12px rgba(0,0,0,.35); }
.binder-card:active { background: #1a3552; }
.binder-spine { width: 26px; flex: none; background: #0a1826; border-right: 1px solid #1d3a57; display: flex; align-items: center; justify-content: center; }
.binder-spine span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #9db4c8; text-transform: uppercase; white-space: nowrap; }
.binder-body { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.binder-cover { flex: 1; min-height: 120px; background: #0a1826; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.binder-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.binder-cover .nocover { font-size: 30px; font-weight: 800; color: #1d3a57; text-align: center; padding: 10px; line-height: 1.1; }
.binder-foot { padding: 10px 10px 11px; }
.binder-foot .bname { font-size: 15px; font-weight: 700; line-height: 1.2; }
.binder-foot .bmeta { font-size: 11px; color: #9db4c8; margin-top: 2px; }
.binder-foot .bcounts { font-size: 12px; color: #c9d8e6; margin-top: 5px; }
.pbar { height: 8px; background: #0a1826; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.pbar > div { height: 100%; background: #22c55e; border-radius: 4px; }
.pct { font-size: 11px; color: #9db4c8; margin-top: 4px; }
.home-foot { font-size: 11px; color: #6b8296; text-align: center; padding: 14px 20px 4px; line-height: 1.5; }
.ver { font-size: 12px; color: #9db4c8; text-align: center; padding: 6px 20px 20px; }
.ver a { color: #7cc4ff; text-decoration: underline; }

/* binder controls */
.controls { padding: 12px 14px 4px; }
.seg { display: flex; background: #0a1826; border-radius: 10px; padding: 3px; }
.seg button { flex: 1; border: none; background: transparent; color: #9db4c8; font-size: 14px; font-weight: 600; padding: 9px 0; border-radius: 8px; }
.seg button.on { background: #e3350d; color: #fff; }
.ctl-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.ctl-label { font-size: 12px; color: #9db4c8; }
.psize { display: flex; gap: 6px; }
.psize button { border: 1px solid #1d3a57; background: #132a44; color: #c9d8e6; border-radius: 8px; padding: 7px 11px; font-size: 13px; font-weight: 600; }
.psize button.on { background: #e3350d; border-color: #e3350d; color: #fff; }
.toggle { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #c9d8e6; }
.toggle input { width: 18px; height: 18px; accent-color: #e3350d; }
.search { width: 100%; margin-top: 10px; background: #0a1826; border: 1px solid #1d3a57; color: #fff; border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.search::placeholder { color: #6b8296; }
.nomatch { font-size: 12px; color: #f59e0b; margin-top: 6px; }
.prog { padding: 10px 14px 0; }
.prog .nums { font-size: 14px; font-weight: 700; }
.prog .nums span { color: #9db4c8; font-weight: 400; }
.reset { float: right; background: none; border: none; color: #6b8296; font-size: 12px; text-decoration: underline; padding: 2px 0; }

/* selection bar (long-press multi-select) */
.selbar { position: sticky; top: 0; z-index: 15; background: #e3350d; border-radius: 10px; padding: 8px 10px; margin: 10px 14px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.selbar .selcount { font-size: 14px; font-weight: 700; color: #fff; margin-right: auto; }
.selbar button { border: none; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 700; background: #fff; color: #b92a0b; }
.selbar button.ghost { background: rgba(255,255,255,.2); color: #fff; }

/* binder pages — one page at a time, looks like a real binder page */
.pages { padding: 6px 10px 20px; }
.pagewrap { perspective: 1200px; }
.binderpage { background: #f6f2e9; border-radius: 10px; padding: 8px; position: relative; box-shadow: 0 4px 18px rgba(0,0,0,.45); }
/* two-page spread: pages sit either side of the centre binding */
.spread { display: flex; position: relative; perspective: 1600px; align-items: stretch; }
.spread .binderpage { flex: 1 1 0; min-width: 0; }
.spread .binderpage.sp-left { border-radius: 10px 3px 3px 10px; }
.spread .binderpage.sp-right { border-radius: 3px 10px 10px 3px; }
.spine { flex: none; width: 18px; background: #0b1f33; border-radius: 2px; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; box-shadow: inset 0 0 8px rgba(0,0,0,.65); padding: 12px 0; }
.spine i { width: 11px; height: 11px; border-radius: 50%; background: #d8d2c4; box-shadow: inset 0 1px 3px rgba(0,0,0,.7); }
/* flipping leaf: the page turning over the binding. Its front is the page
   being turned; its back is the next page on the other side. The next page
   is already rendered underneath and is revealed as the leaf lifts. */
.leaf { position: absolute; top: 0; bottom: 0; width: calc(50% - 9px); transform-style: preserve-3d; z-index: 5; transition: transform .55s ease-in-out; }
.leaf.fwd { left: calc(50% + 9px); transform-origin: left center; }
.leaf.bwd { left: 0; transform-origin: right center; }
.leaf-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.leaf-face.back { transform: rotateY(180deg); }
.leaf-face .binderpage { height: 100%; box-sizing: border-box; }
.page-h { font-size: 12px; color: #8a7f6a; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 2px 0 6px; }
.page-foot { text-align: center; font-size: 11px; color: #9a8f7a; margin-top: 8px; }
.divider { grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: #1d4ed8; letter-spacing: .5px; padding: 10px 2px 2px; border-bottom: 1px solid #d8d2c4; margin-bottom: 2px; }
.grid { display: grid; gap: 6px; }
.grid.c2 { grid-template-columns: repeat(2, 1fr); }
.grid.c3 { grid-template-columns: repeat(3, 1fr); }
.grid.c4 { grid-template-columns: repeat(4, 1fr); }
.pocket { background: #fff; border: 2px solid #d8d2c4; border-radius: 8px; overflow: hidden; position: relative; }
.pocket.got { border-color: #22c55e; }
.pocket.got .thumb { opacity: .55; }
.pocket .check { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(10,24,38,.85); border: 2px solid #5b7a96; color: transparent; font-size: 15px; line-height: 20px; text-align: center; z-index: 2; font-weight: 700; }
.pocket.got .check { background: #22c55e; border-color: #22c55e; color: #fff; }
.pocket .selbox { position: absolute; top: 6px; left: 6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.9); border: 2px solid #e3350d; color: transparent; font-size: 15px; line-height: 20px; text-align: center; z-index: 2; font-weight: 700; }
.pocket.sel { border-color: #e3350d; box-shadow: 0 0 0 2px rgba(227,53,13,.35); }
.pocket.sel .selbox { background: #e3350d; border-color: #e3350d; color: #fff; }
.thumb { aspect-ratio: 63 / 88; background: #ece7db; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .noimg { font-size: 11px; color: #8a7f6a; text-align: center; padding: 6px; line-height: 1.4; }
.pinfo { padding: 6px 7px 8px; }
.pinfo .num { font-size: 11px; color: #1d4ed8; font-weight: 700; }
.pinfo .nm { font-size: 12.5px; font-weight: 600; line-height: 1.25; margin-top: 1px; min-height: 2.5em; color: #1f2937; }
.pinfo .meta { font-size: 10.5px; color: #6b7280; margin-top: 3px; line-height: 1.3; }
.pinfo .grp { display: inline-block; background: #dbeafe; border-radius: 4px; padding: 1px 5px; font-size: 10px; color: #1e40af; margin-top: 4px; }
.empty { text-align: center; color: #6b7280; padding: 30px 10px; font-size: 14px; line-height: 1.6; }
.pagenav { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.pagenav button { flex: 1; border: 1px solid #1d3a57; background: #132a44; color: #fff; border-radius: 10px; padding: 11px; font-size: 15px; font-weight: 700; }
.pagenav button:disabled { opacity: .35; }
.pagenav span { font-size: 13px; color: #9db4c8; white-space: nowrap; }
@keyframes slideIn { 0% { transform: translateY(-110%) scale(.9); opacity: 0; } 60% { transform: translateY(4%) scale(1.02); opacity: 1; } 100% { transform: translateY(0) scale(1); } }
.pocket.slide-in .thumb img { animation: slideIn .7s ease-out; }
.pocket.slide-in { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.5); }
@keyframes flashRing { 0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } 50% { box-shadow: 0 0 0 4px rgba(34,197,94,.85); } }
.pocket.flash { animation: flashRing 1.1s ease-out 2; }

/* scan view */
.scan { padding: 16px 14px 24px; }
.scan p { font-size: 14px; color: #c9d8e6; line-height: 1.55; margin-bottom: 12px; }
/* in-app camera: live preview with a card outline; OCR only reads the outline */
.camwrap { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
.camwrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
.camframe { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); height: 88%; aspect-ratio: 63 / 88; border: 3px solid #fff; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,.62); pointer-events: none; }
.camhint { font-size: 13px; color: #c9d8e6; text-align: center; margin: 0 0 12px; }
.scan .scanstatus { font-size: 14px; color: #7cc4ff; margin: 12px 0; min-height: 20px; }
.scan .scanpreview img { width: 100%; max-width: 300px; border-radius: 12px; display: block; margin: 0 auto; }
.scanresult { background: #132a44; border: 1px solid #1d3a57; border-radius: 12px; padding: 12px; margin-top: 12px; display: flex; gap: 12px; align-items: center; }
.scanresult img { width: 72px; border-radius: 6px; flex: none; }
.scanresult .sr-name { font-size: 16px; font-weight: 700; }
.scanresult .sr-meta { font-size: 12px; color: #9db4c8; margin-top: 3px; line-height: 1.45; }
.scanresult .sr-add { margin-left: auto; flex: none; border: none; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 700; background: #22c55e; color: #fff; }
.scanresult .sr-add:disabled { background: #1d3a57; color: #9db4c8; }
.scanresult .sr-in { margin-left: auto; flex: none; font-size: 13px; font-weight: 700; color: #22c55e; }
.scan .manual { margin-top: 18px; }
.scan .manual input { width: 100%; background: #0a1826; border: 1px solid #1d3a57; color: #fff; border-radius: 10px; padding: 10px 12px; font-size: 15px; }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(4,10,18,.92); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px; }
.modal img { max-width: 92vw; max-height: 68vh; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
.modal .mname { font-size: 18px; font-weight: 700; margin-top: 14px; text-align: center; }
.modal .mdetail { font-size: 13px; color: #9db4c8; margin-top: 5px; text-align: center; line-height: 1.5; }
.modal .mbtns { display: flex; gap: 10px; margin-top: 16px; }
.modal .mbtns button { border: none; border-radius: 10px; padding: 11px 18px; font-size: 15px; font-weight: 700; }
.modal .have { background: #22c55e; color: #fff; }
.modal .need { background: #1d3a57; color: #fff; }
.modal .close { background: #e3350d; color: #fff; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<script>
const DATA = /*__DATA__*/;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let view = { name: 'home' };
let binderState = {}; // id -> {mode, pageSize, hide, query, spread, highlight}
let modalOpen = false;
let sel = { binder: null, ids: new Set() }; // long-press multi-select
let slideId = null; // row id to animate sliding into its pocket (after a scan add)
let highlightToken = 0;
let camStream = null; // live camera stream for the scan view, if open
// Stop the in-app camera (called when leaving the scan view, so the camera
// is never left running behind another screen).
function stopCamera() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const v = document.getElementById('camVideo');
  if (v) v.srcObject = null;
}

function bstate(id) {
  if (!binderState[id]) {
    binderState[id] = {
      mode: store.get('mst:mode:' + id, 'master'),
      pageSize: store.get('mst:psize:' + id, 9),
      hide: store.get('mst:hide:' + id, false),
      query: '',
      spread: 0,
      highlight: null
    };
  }
  return binderState[id];
}
function checkedSet(id) {
  const a = store.get('mst:checked:' + id, []);
  return new Set(a);
}
function setChecked(id, rowId, val) {
  const s = checkedSet(id);
  if (val) s.add(rowId); else s.delete(rowId);
  store.set('mst:checked:' + id, Array.from(s));
}
function rowId(bid, idx) { return bid + '#' + idx; }
function normNum(n) {
  n = (n || '').split('/')[0].replace(/^0+/, '');
  return n === '' ? '0' : n;
}
function largeImg(url) {
  if (!url) return null;
  if (url.indexOf('images.scrydex.com/pokemon/') >= 0) return url.replace(/\/small$/, '/large');
  if (url.indexOf('images.pokemontcg.io/') >= 0) return url.replace(/\.png$/, '_hires.png');
  if (url.indexOf('assets.tcgdex.net/') >= 0) return url.replace(/\/low\.png$/, '/high.png');
  return url;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function finishOf(v) {
  v = v || '';
  if (v.indexOf('Reverse Holo') !== -1) return 'Reverse Holo';
  if (v.indexOf('Holo') !== -1) return 'Holo';
  return 'Base';
}
// Card description (Jeremy's spec): number, rarity, promo if it applies,
// set name, and finish (Holo / Reverse Holo / Base). Parts after the number.
function descParts(c, b) {
  const p = [];
  if (c.r) p.push(c.r);
  if (c.promo) p.push('Promo');
  p.push(c.set || b.name);
  p.push(finishOf(c.v));
  return p;
}
// Tell the native side what the user is looking at, so the phone back button
// can go back inside the app instead of closing it.
function reportView() {
  if (typeof AndroidApp === 'undefined' || !AndroidApp.setView) return;
  let s = view.name;
  if (modalOpen) s = 'modal';
  try { AndroidApp.setView(s); } catch (e) {}
}
function goHome() {
  exitSelMode();
  closeModal(true);
  view = { name: 'home' };
  render();
  window.scrollTo(0, 0);
}
function exitSelMode() {
  sel.binder = null;
  sel.ids = new Set();
}
function visibleRows(b) {
  const st = bstate(b.id);
  const out = [];
  b.cards.forEach((c, idx) => {
    if (st.mode === 'master' && !c.m) return;
    if (st.mode === 'grand' && !c.g) return;
    const id = rowId(b.id, idx);
    if (st.hide && checkedSet(b.id).has(id)) return;
    out.push({ c: c, idx: idx, id: id });
  });
  return out;
}
function modeRows(b) {
  return b.cards.filter(c => bstate(b.id).mode === 'master' ? c.m : c.g);
}
function progress(b) {
  const rows = modeRows(b);
  const got = checkedSet(b.id);
  let n = 0;
  b.cards.forEach((c, idx) => {
    if ((bstate(b.id).mode === 'master' ? c.m : c.g) && got.has(rowId(b.id, idx))) n++;
  });
  return { n: n, total: rows.length, pct: rows.length ? Math.round(n * 100 / rows.length) : 0 };
}

function render() {
  stopCamera();
  const app = document.getElementById('app');
  if (view.name === 'home') { renderHome(app); }
  else if (view.name === 'scan') { renderScan(app); }
  else { renderBinder(app, DATA.binders.find(b => b.id === view.binder)); }
  reportView();
}

function renderHome(app) {
  let h = '<div class="topbar"><h1>Master<span>set</span> Tracker</h1><div class="sub">PokeCottage checklists &middot; tap a binder to track it</div></div><div class="home">'
    + '<button class="scanbtn" id="scanBtn">Scan a card</button><div class="home-grid">';
  DATA.binders.forEach(b => {
    const p = progress(b);
    const st = bstate(b.id);
    const total = st.mode === 'master' ? b.masterTotal : b.grandMasterTotal;
    const cover = b.cover
      ? '<img src="' + esc(b.cover) + '" alt="' + esc(b.name) + ' Elite Trainer Box" onerror="this.parentNode.innerHTML=\'<div class=&quot;nocover&quot;>' + esc(b.name) + '</div>\'">'
      : '<div class="nocover">' + esc(b.name) + '</div>';
    h += '<div class="binder-card" data-binder="' + b.id + '">'
      + '<div class="binder-spine"><span>' + esc(b.name) + '</span></div>'
      + '<div class="binder-body"><div class="binder-cover">' + cover + '</div>'
      + '<div class="binder-foot"><div class="bname">' + esc(b.name) + '</div>'
      + '<div class="bmeta">' + esc(b.series || '') + (b.releaseDate ? ' &middot; ' + esc(b.releaseDate) : '') + '</div>'
      + '<div class="bcounts">' + (st.mode === 'master' ? 'Master' : 'Grand Master') + ' &middot; ' + total + ' cards</div>'
      + '<div class="pbar"><div style="width:' + p.pct + '%"></div></div>'
      + '<div class="pct">' + p.n + ' / ' + p.total + ' collected &middot; ' + p.pct + '%</div>'
      + '</div></div></div>';
  });
  h += '</div><div class="home-foot">Checklists from PokeCottage. Master = one of each card number, including secret rares. Grand Master adds the holo and reverse-holo versions, promos and special variants. Ditto covers every card, cameo, Topps, vending and language printing found. Card pictures need internet; your checks are saved on this phone.</div><div class="ver" id="verRow"></div></div>';
  app.innerHTML = h;
  document.getElementById('scanBtn').addEventListener('click', () => { view = { name: 'scan' }; render(); window.scrollTo(0, 0); });
  app.querySelectorAll('.binder-card').forEach(el => {
    el.addEventListener('click', () => { view = { name: 'binder', binder: el.getAttribute('data-binder') }; render(); window.scrollTo(0, 0); });
  });
  if (typeof AndroidApp !== 'undefined') {
    const vr = document.getElementById('verRow');
    vr.innerHTML = 'Version ' + esc(AndroidApp.versionName()) + ' &middot; <a id="updLink">Check for updates</a>';
    document.getElementById('updLink').addEventListener('click', () => { AndroidApp.checkForUpdates(); });
  }
}

function renderBinder(app, b) {
  const st = bstate(b.id);
  const p = progress(b);
  const total = st.mode === 'master' ? b.masterTotal : b.grandMasterTotal;
  let h = '<div class="topbar"><button class="backbtn" id="backBtn">&larr; Binders</button>'
    + '<h1>' + esc(b.name) + '</h1>'
    + '<div class="sub">' + esc(b.series || '') + (b.releaseDate ? ' &middot; ' + esc(b.releaseDate) : '') + ' &middot; Master ' + b.masterTotal + ' &middot; Grand ' + b.grandMasterTotal + '</div></div>'
    + '<div class="controls">'
    + '<div class="seg"><button id="modeMaster" class="' + (st.mode === 'master' ? 'on' : '') + '">Master Set</button>'
    + '<button id="modeGrand" class="' + (st.mode === 'grand' ? 'on' : '') + '">Grand Master</button></div>'
    + '<div class="ctl-row"><span class="ctl-label">Page size</span><span class="psize">'
    + [4, 9, 12, 16].map(n => '<button data-ps="' + n + '" class="' + (st.pageSize === n ? 'on' : '') + '">' + n + '</button>').join('')
    + '</span><label class="toggle"><input type="checkbox" id="hideChk"' + (st.hide ? ' checked' : '') + '> Missing only</label></div>'
    + '<input class="search" id="q" type="search" placeholder="Search name or number&hellip;" value="' + esc(st.query) + '">'
    + '<div class="nomatch hidden" id="noMatch"></div>'
    + '</div>'
    + '<div class="prog"><span class="nums">' + p.n + ' / ' + p.total + ' <span>&middot; ' + p.pct + '% collected &middot; ' + (st.mode === 'master' ? 'Master' : 'Grand Master') + '</span></span>'
    + '<button class="reset" id="resetBtn">Reset checks</button>'
    + '<div class="pbar"><div style="width:' + p.pct + '%"></div></div></div>'
    + '<div class="pages" id="pages"></div>';
  app.innerHTML = h;

  document.getElementById('backBtn').addEventListener('click', () => { goHome(); });
  document.getElementById('modeMaster').addEventListener('click', () => setMode(b, 'master'));
  document.getElementById('modeGrand').addEventListener('click', () => setMode(b, 'grand'));
  app.querySelectorAll('[data-ps]').forEach(btn => btn.addEventListener('click', () => {
    st.pageSize = parseInt(btn.getAttribute('data-ps'), 10);
    store.set('mst:psize:' + b.id, st.pageSize);
    st.spread = 0;
    render();
  }));
  document.getElementById('hideChk').addEventListener('change', (e) => {
    st.hide = e.target.checked;
    store.set('mst:hide:' + b.id, st.hide);
    st.spread = 0;
    render();
  });
  document.getElementById('q').addEventListener('input', (e) => { onSearch(b, e.target.value); });
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('Clear all checks in this binder?')) { store.set('mst:checked:' + b.id, []); render(); }
  });
  renderPages(b);
}

function setMode(b, mode) {
  const st = bstate(b.id);
  st.mode = mode;
  store.set('mst:mode:' + b.id, mode);
  st.spread = 0;
  st.highlight = null;
  render();
}

// Search jumps to the page holding the first matching card (binder order),
// instead of filtering the list down.
function onSearch(b, q) {
  const st = bstate(b.id);
  st.query = q;
  const nm = document.getElementById('noMatch');
  const rows = visibleRows(b);
  const qq = q.trim().toLowerCase();
  if (!qq) {
    st.highlight = null;
    if (nm) { nm.classList.add('hidden'); nm.textContent = ''; }
    renderPages(b);
    return;
  }
  let found = -1;
  for (let i = 0; i < rows.length; i++) {
    const c = rows[i].c;
    const hay = ((c.n || '') + ' ' + (c.name || '') + ' ' + (c.s || '') + ' ' + (c.v || '') + ' ' + (c.lang || '') + ' ' + (c.grp || '') + ' ' + (c.set || '')).toLowerCase();
    if (hay.indexOf(qq) >= 0) { found = i; break; }
  }
  if (found < 0) {
    st.highlight = null;
    if (nm) { nm.classList.remove('hidden'); nm.textContent = 'No card matches "' + q + '" in this binder.'; }
    renderPages(b);
    return;
  }
  if (nm) { nm.classList.add('hidden'); nm.textContent = ''; }
  st.spread = Math.floor(Math.floor(found / st.pageSize) / 2);
  st.highlight = rows[found].id;
  renderPages(b);
  const tok = ++highlightToken;
  setTimeout(() => { if (tok === highlightToken) { st.highlight = null; } }, 2600);
}

// One binder page (a chunk of rows) as a .binderpage div. pageIdx is
// 0-based; past the last page it returns a blank paper page.
function pageHTML(b, pageIdx, rows, cols, got) {
  const st = bstate(b.id);
  const totalPages = Math.max(1, Math.ceil(rows.length / st.pageSize));
  const side = (pageIdx % 2 === 0) ? 'sp-left' : 'sp-right';
  if (pageIdx >= totalPages) {
    return '<div class="binderpage ' + side + ' blank"><div class="page-h">Page ' + (pageIdx + 1) + ' of ' + totalPages + '</div><div class="grid c' + cols + '"></div></div>';
  }
  const start = pageIdx * st.pageSize;
  const chunk = rows.slice(start, start + st.pageSize);
  let lastDiv = null;
  for (let i = 0; i < start; i++) { if (rows[i].c.div) lastDiv = rows[i].c.div; }
  let h = '<div class="binderpage ' + side + '"><div class="page-h">Page ' + (pageIdx + 1) + ' of ' + totalPages + '</div><div class="grid c' + cols + '">';
  chunk.forEach(r => {
    const c = r.c;
    if (c.div && c.div !== lastDiv) {
      h += '<div class="divider">' + esc(c.div) + '</div>';
    }
    lastDiv = c.div || lastDiv;
    const isGot = got.has(r.id);
    const img = c.img
      ? '<img src="' + esc(c.img) + '" loading="lazy" alt="' + esc(c.name) + '" data-full="' + esc(largeImg(c.img) || c.img) + '" onerror="this.parentNode.innerHTML=\'<div class=&quot;noimg&quot;>No image yet</div>\'">'
      : '<div class="noimg">No image yet</div>';
    // Pocket shows the card itself only — the description lives in the tap
    // modal (data-meta / data-extra on the thumb).
    const modalDesc = descParts(c, b).join(' · ');
    const extra = [];
    if (c.v && c.v !== 'Regular' && c.v !== 'Standard') extra.push(c.v);
    if (c.lang && c.lang !== 'English') extra.push(c.lang);
    const isSel = sel.binder === b.id && sel.ids.has(r.id);
    const animCls = (slideId === r.id) ? ' slide-in' : (st.highlight === r.id ? ' flash' : '');
    h += '<div class="pocket' + (isGot ? ' got' : '') + (isSel ? ' sel' : '') + animCls + '" data-id="' + r.id + '">'
      + '<div class="check">' + (isGot ? '&#10003;' : '') + '</div>'
      + (sel.binder === b.id ? '<div class="selbox">' + (isSel ? '&#10003;' : '') + '</div>' : '')
      + '<div class="thumb" data-full="' + esc(largeImg(c.img) || '') + '" data-name="' + esc(c.name) + '" data-num="' + esc(c.n) + '" data-meta="' + esc(modalDesc) + '" data-extra="' + esc(extra.join(' · ')) + '" data-id2="' + r.id + '">' + img + '</div>'
      + '</div>';
  });
  if (!chunk.length) {
    h += '<div class="empty">Nothing here yet.<br>Try another page size, or switch Master / Grand Master.</div>';
  }
  h += '</div></div>';
  return h;
}

function renderPages(b) {
  const st = bstate(b.id);
  const got = checkedSet(b.id);
  const rows = visibleRows(b);
  const totalPages = Math.max(1, Math.ceil(rows.length / st.pageSize));
  const totalSpreads = Math.max(1, Math.ceil(totalPages / 2));
  if (st.spread >= totalSpreads) st.spread = totalSpreads - 1;
  if (st.spread < 0) st.spread = 0;
  const cols = st.pageSize === 4 ? 2 : st.pageSize === 16 ? 4 : 3;
  const pagesEl = document.getElementById('pages');
  if (!pagesEl) return;
  let h = '';
  // multi-select bar (long-press)
  if (sel.binder === b.id) {
    const n = sel.ids.size;
    h += '<div class="selbar"><span class="selcount">' + n + ' selected</span>'
      + '<button id="selAll">Select all</button>'
      + '<button id="selAdd"' + (n ? '' : ' disabled') + '>Add to collection</button>'
      + '<button id="selRemove"' + (n ? '' : ' disabled') + '>Remove from collection</button>'
      + '<button id="selDone" class="ghost">Done</button></div>';
  }
  // two-page spread, open at the binding
  const leftIdx = st.spread * 2, rightIdx = leftIdx + 1;
  const lo = leftIdx + 1, hi = Math.min(rightIdx + 1, totalPages);
  const range = lo === hi ? ('Page ' + lo) : ('Pages ' + lo + '–' + hi);
  h += '<div class="pagewrap"><div class="spread" id="spreadEl">'
    + pageHTML(b, leftIdx, rows, cols, got)
    + '<div class="spine"><i></i><i></i><i></i></div>'
    + pageHTML(b, rightIdx, rows, cols, got)
    + '</div>'
    + '<div class="page-foot">' + range + ' of ' + totalPages + '</div></div>';
  h += '<div class="pagenav"><button id="prevPg"' + (st.spread === 0 ? ' disabled' : '') + '>&larr; Prev</button>'
    + '<span>' + range + ' of ' + totalPages + '</span>'
    + '<button id="nextPg"' + (st.spread >= totalSpreads - 1 ? ' disabled' : '') + '>Next &rarr;</button></div>';
  pagesEl.innerHTML = h;

  // selection bar actions
  if (sel.binder === b.id) {
    document.getElementById('selAll').addEventListener('click', () => {
      visibleRows(b).forEach(r => sel.ids.add(r.id));
      renderPages(b);
    });
    document.getElementById('selAdd').addEventListener('click', () => {
      sel.ids.forEach(id => setChecked(b.id, id, true));
      render();
    });
    document.getElementById('selRemove').addEventListener('click', () => {
      sel.ids.forEach(id => setChecked(b.id, id, false));
      render();
    });
    document.getElementById('selDone').addEventListener('click', () => { exitSelMode(); renderPages(b); });
  }

  // page navigation + swipe to turn the page
  document.getElementById('prevPg').addEventListener('click', () => turnPage(b, -1));
  document.getElementById('nextPg').addEventListener('click', () => turnPage(b, 1));
  const wrap = pagesEl.querySelector('.pagewrap');
  let tsX = 0, tsY = 0, tsT = 0;
  wrap.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    tsX = t.clientX; tsY = t.clientY; tsT = Date.now();
  }, { passive: true });
  wrap.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - tsX, dy = t.clientY - tsY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - tsT < 800) {
      if (dx < 0) turnPage(b, 1); else turnPage(b, -1);
    }
  }, { passive: true });

  // pockets: tap = info, long-press = multi-select
  let lpTimer = null, lpFired = false;
  pagesEl.querySelectorAll('.pocket').forEach(pk => {
    const id = pk.getAttribute('data-id');
    pk.addEventListener('pointerdown', () => {
      lpFired = false;
      clearTimeout(lpTimer);
      lpTimer = setTimeout(() => {
        lpFired = true;
        sel.binder = b.id;
        sel.ids = new Set([id]);
        if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }
        renderPages(b);
      }, 450);
    });
    ['pointerup', 'pointermove', 'pointercancel', 'pointerleave'].forEach(ev => {
      pk.addEventListener(ev, () => clearTimeout(lpTimer));
    });
    pk.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      clearTimeout(lpTimer);
      sel.binder = b.id;
      sel.ids = new Set([id]);
      renderPages(b);
    });
    pk.addEventListener('click', () => {
      if (lpFired) { lpFired = false; return; }
      if (sel.binder === b.id) {
        if (sel.ids.has(id)) sel.ids.delete(id); else sel.ids.add(id);
        renderPages(b);
        return;
      }
      openModal(b, pk.querySelector('.thumb'));
    });
  });
  if (slideId) {
    const tok = ++highlightToken;
    setTimeout(() => { if (tok === highlightToken) { slideId = null; } }, 3000);
  }
}

let turning = false;
function turnPage(b, dir) {
  if (turning) return;
  const st = bstate(b.id);
  const rows = visibleRows(b);
  const totalPages = Math.max(1, Math.ceil(rows.length / st.pageSize));
  const totalSpreads = Math.max(1, Math.ceil(totalPages / 2));
  const next = st.spread + dir;
  if (next < 0 || next >= totalSpreads) return;
  turning = true;
  const cols = st.pageSize === 4 ? 2 : st.pageSize === 16 ? 4 : 3;
  const got = checkedSet(b.id);
  // The leaf is the page turning over the binding. Its front is the page
  // being turned; its back is the next page on the other side. The next
  // spread is rendered underneath first, so it is revealed as the leaf lifts.
  const oldLeft = pageHTML(b, st.spread * 2, rows, cols, got);
  const oldRight = pageHTML(b, st.spread * 2 + 1, rows, cols, got);
  const newLeft = pageHTML(b, next * 2, rows, cols, got);
  const newRight = pageHTML(b, next * 2 + 1, rows, cols, got);
  const oldSpread = document.getElementById('spreadEl');
  const oldH = oldSpread ? oldSpread.offsetHeight : 0;
  st.spread = next;
  renderPages(b);
  const spread = document.getElementById('spreadEl');
  if (!spread) { turning = false; return; }
  // Keep the spread at least as tall as the one being turned, so the leaf
  // (the old page) is never clipped by a shorter next spread.
  if (oldH > 0) spread.style.minHeight = oldH + 'px';
  const leaf = document.createElement('div');
  leaf.className = 'leaf ' + (dir > 0 ? 'fwd' : 'bwd');
  leaf.innerHTML = '<div class="leaf-face front">' + (dir > 0 ? oldRight : oldLeft) + '</div>'
    + '<div class="leaf-face back">' + (dir > 0 ? newLeft : newRight) + '</div>';
  spread.appendChild(leaf);
  void leaf.offsetWidth; // force reflow so the transition runs
  leaf.style.transform = dir > 0 ? 'rotateY(-180deg)' : 'rotateY(180deg)';
  setTimeout(() => { leaf.remove(); turning = false; }, 620);
}

function openModal(b, th) {
  const m = document.getElementById('modal');
  const full = th.getAttribute('data-full');
  const name = th.getAttribute('data-name');
  const num = th.getAttribute('data-num');
  const meta = th.getAttribute('data-meta');
  const extra = th.getAttribute('data-extra');
  const id = th.getAttribute('data-id2');
  const isGot = checkedSet(b.id).has(id);
  m.innerHTML = (full ? '<img src="' + esc(full) + '" onerror="this.style.display=\'none\'">' : '<div class="mname">No image yet</div>')
    + '<div class="mname">' + esc(name) + '</div>'
    + '<div class="mdetail">#' + esc(num) + ' &middot; ' + esc(meta) + (extra ? '<br>' + esc(extra) : '') + '</div>'
    + '<div class="mbtns"><button class="' + (isGot ? 'need' : 'have') + '" id="mToggle">' + (isGot ? 'Mark as needed' : 'Mark as have') + '</button>'
    + '<button class="close" id="mClose">Close</button></div>';
  m.classList.remove('hidden');
  modalOpen = true;
  reportView();
  document.getElementById('mClose').addEventListener('click', () => { closeModal(); });
  m.onclick = (e) => { if (e.target === m) { closeModal(); } };
  document.getElementById('mToggle').addEventListener('click', () => {
    const y = window.scrollY;
    setChecked(b.id, id, !checkedSet(b.id).has(id));
    closeModal(true);
    render();
    window.scrollTo(0, y);
  });
}
function closeModal(silent) {
  const m = document.getElementById('modal');
  m.classList.add('hidden');
  m.innerHTML = '';
  if (modalOpen) { modalOpen = false; if (!silent) reportView(); }
}

// Jump to a card's binder and page (used after a scan add and by search).
// Picks the mode that contains the card and makes sure it is visible.
function jumpToCard(b, rowId, animate) {
  const st = bstate(b.id);
  const idx = parseInt(rowId.split('#')[1], 10);
  const c = b.cards[idx];
  if (!c) return;
  st.mode = c.m ? 'master' : 'grand';
  store.set('mst:mode:' + b.id, st.mode);
  st.hide = false;
  store.set('mst:hide:' + b.id, false);
  const rows = visibleRows(b);
  const pos = rows.findIndex(r => r.id === rowId);
  if (pos >= 0) st.spread = Math.floor(Math.floor(pos / st.pageSize) / 2);
  st.highlight = rowId;
  slideId = animate ? rowId : null;
  exitSelMode();
  view = { name: 'binder', binder: b.id };
  render();
  window.scrollTo(0, 0);
}

// ---------- Scan a card ----------
let tessLoading = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (tessLoading) return tessLoading;
  tessLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('Could not load the card reader — check your internet and try again.'));
    document.head.appendChild(s);
  });
  return tessLoading;
}
function parseScanText(text) {
  const numM = text.match(/(\d{1,3})\s*\/\s*(\d{1,3})/);
  const num = numM ? (parseInt(numM[1], 10) + '/' + parseInt(numM[2], 10)) : null;
  // The card name is one of the lines — prefer a line that matches a card
  // name in the catalog exactly.
  const known = new Set();
  DATA.binders.forEach(b => b.cards.forEach(c => { if (c.name) known.add(c.name.toLowerCase()); }));
  const lines = text.split('\n').map(s => s.trim()).filter(s => s.length > 1);
  let name = null;
  for (const ln of lines) {
    const clean = ln.replace(/[^A-Za-z'’\-. ]/g, '').replace(/\s+/g, ' ').trim();
    if (clean && known.has(clean.toLowerCase())) { name = clean; break; }
  }
  if (!name) {
    for (const ln of lines) {
      const clean = ln.replace(/[^A-Za-z'’\-. ]/g, '').replace(/\s+/g, ' ').trim();
      if (/^[A-Za-z][A-Za-z'’\-. ]{2,30}$/.test(clean) && !/^(BASIC|STAGE|POKEMON|TRAINER|ENERGY|VSTAR|GX|EX)$/i.test(clean)) { name = clean; break; }
    }
  }
  return { name: name, num: num };
}
function findMatches(name, num, manual) {
  const out = [];
  const q = (name || '').toLowerCase();
  DATA.binders.forEach(b => {
    b.cards.forEach((c, idx) => {
      const id = rowId(b.id, idx);
      const cname = (c.name || '').toLowerCase();
      let score = 0;
      if (manual) {
        if (q && cname.indexOf(q) >= 0) score = 1;
      } else {
        if (name && cname === q) score = 1;
        if (score && num && normNum(c.n) === normNum(num)) score = 2;
      }
      if (score) out.push({ b: b, c: c, id: id, score: score });
    });
  });
  out.sort((a, b2) => b2.score - a.score);
  return out.slice(0, 6);
}
function renderScanResults(matches, read) {
  const el = document.getElementById('scanResults');
  if (!el) return;
  if (!matches.length) {
    el.innerHTML = '<div class="scanresult"><div><div class="sr-name">Couldn\'t identify that card</div>'
      + '<div class="sr-meta">The reader saw' + (read.name ? ' "' + esc(read.name) + '"' : ' no name') + (read.num ? ' and number ' + esc(read.num) : '') + '. Try a straighter, brighter photo, or type the name below.</div></div></div>';
    return;
  }
  let h = '';
  matches.forEach((mt, i) => {
    const isGot = checkedSet(mt.b.id).has(mt.id);
    const img = mt.c.img ? '<img src="' + esc(mt.c.img) + '" alt="' + esc(mt.c.name) + '">' : '<img src="" alt="" style="visibility:hidden">';
    h += '<div class="scanresult">' + img
      + '<div><div class="sr-name">' + esc(mt.c.name) + '</div>'
      + '<div class="sr-meta">#' + esc(mt.c.n) + ' &middot; ' + esc(descParts(mt.c, mt.b).join(' · ')) + '</div></div>'
      + (isGot
        ? '<span class="sr-in">In collection</span>'
        : '<button class="sr-add" data-b="' + mt.b.id + '" data-id="' + mt.id + '">Add</button>')
      + '</div>';
  });
  el.innerHTML = h;
  el.querySelectorAll('.sr-add').forEach(btn => {
    btn.addEventListener('click', () => {
      const b = DATA.binders.find(x => x.id === btn.getAttribute('data-b'));
      const id = btn.getAttribute('data-id');
      setChecked(b.id, id, true);
      jumpToCard(b, id, true);
    });
  });
}
// Map the on-screen card outline to the camera frame's pixels. The video
// is shown with object-fit: cover, so the frame is scaled to cover the
// element and centre-cropped — this undoes that mapping.
function cropToFrame(video, frameEl) {
  const vr = video.getBoundingClientRect();
  const fr = frameEl.getBoundingClientRect();
  const iw = video.videoWidth, ih = video.videoHeight;
  const scale = Math.max(vr.width / iw, vr.height / ih);
  const dispW = iw * scale, dispH = ih * scale;
  const offX = (vr.width - dispW) / 2, offY = (vr.height - dispH) / 2;
  const sx = (fr.left - vr.left - offX) / scale;
  const sy = (fr.top - vr.top - offY) / scale;
  const sw = fr.width / scale, sh = fr.height / scale;
  const x = Math.max(0, sx), y = Math.max(0, sy);
  return { x: x, y: y, w: Math.min(iw - x, sw), h: Math.min(ih - y, sh) };
}
function renderScan(app) {
  let h = '<div class="topbar"><button class="backbtn" id="backBtn">&larr; Binders</button>'
    + '<h1>Scan a card</h1><div class="sub">Line the card up in the frame — the reader only looks at what\'s inside it.</div></div>'
    + '<div class="scan">'
    + '<p>Hold the card straight, name at the top, number at the bottom-left. The scan only reads what\'s inside the frame, so the background can\'t confuse it. Good light helps — avoid glare on the card.</p>'
    + '<div class="camwrap hidden" id="camWrap"><video id="camVideo" autoplay playsinline muted></video><div class="camframe" id="camFrame"></div></div>'
    + '<div class="camhint hidden" id="camHint">Line the card up inside the frame, then tap Capture.</div>'
    + '<input type="file" id="scanFile" accept="image/*" capture="environment" class="hidden">'
    + '<input type="file" id="scanFile2" accept="image/*" class="hidden">'
    + '<button class="scanbtn" id="scanOpenCam">Open camera</button>'
    + '<button class="scanbtn hidden" id="scanCapture">Capture</button>'
    + '<button class="scanbtn ghost hidden" id="scanCloseCam">Close camera</button>'
    + '<button class="scanbtn hidden" id="scanTakeSys">Use system camera</button>'
    + '<button class="scanbtn ghost" id="scanPick">Choose from gallery</button>'
    + '<div class="scanstatus" id="scanStatus"></div>'
    + '<div class="scanpreview" id="scanPreview"></div>'
    + '<div id="scanResults"></div>'
    + '<div class="manual"><input id="scanManual" type="search" placeholder="Or type the card name&hellip;"></div>'
    + '</div>';
  app.innerHTML = h;
  document.getElementById('backBtn').addEventListener('click', () => { stopCamera(); goHome(); });
  const status = (t) => { const el = document.getElementById('scanStatus'); if (el) el.textContent = t; };
  const show = (id, on) => { const el = document.getElementById(id); if (el) el.classList.toggle('hidden', !on); };
  // Run the card reader on one image (a File from the gallery/system camera,
  // or a data URL of the cropped frame from the in-app camera).
  const runOcr = (source) => {
    status('Loading the card reader…');
    loadTesseract().then(() => {
      status('Reading the card…');
      return Tesseract.recognize(source, 'eng', {
        workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js',
        corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract-core.wasm.js',
        langPath: 'https://tessdata.projectnaptha.com/4.0.0',
        logger: (m) => { if (m.status === 'recognizing text') status('Reading the card… ' + Math.round(m.progress * 100) + '%'); }
      });
    }).then(res => {
      const read = parseScanText(res.data.text || '');
      status(read.name ? ('Read as "' + read.name + '"' + (read.num ? ' #' + read.num : '') + '.') : 'Finished reading.');
      renderScanResults(findMatches(read.name, read.num, false), read);
    }).catch(err => {
      status(err && err.message ? err.message : 'Could not read that photo. Try again.');
    });
  };
  const onFile = (file) => {
    if (!file) return;
    const pv = document.getElementById('scanPreview');
    if (pv) pv.innerHTML = '<img src="' + URL.createObjectURL(file) + '" alt="Scanned card">';
    document.getElementById('scanResults').innerHTML = '';
    runOcr(file);
  };
  const openCamera = () => {
    show('scanOpenCam', false); show('scanPick', false); show('scanTakeSys', false);
    status('Opening the camera…');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status('This phone can\'t open the in-app camera. Use the system camera or gallery instead.');
      show('scanTakeSys', true); show('scanOpenCam', true); show('scanPick', true);
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }).then(stream => {
      camStream = stream;
      const v = document.getElementById('camVideo');
      v.srcObject = stream;
      return v.play();
    }).then(() => {
      show('camWrap', true); show('camHint', true);
      show('scanCapture', true); show('scanCloseCam', true);
      status('');
    }).catch(() => {
      stopCamera();
      status('Couldn\'t open the camera — check the camera permission, or use the system camera or gallery instead.');
      show('scanTakeSys', true); show('scanOpenCam', true); show('scanPick', true);
    });
  };
  const closeCamera = () => {
    stopCamera();
    show('camWrap', false); show('camHint', false);
    show('scanCapture', false); show('scanCloseCam', false);
    show('scanOpenCam', true); show('scanPick', true);
    status('');
  };
  const captureFrame = () => {
    const v = document.getElementById('camVideo');
    const fr = document.getElementById('camFrame');
    if (!v || !v.videoWidth) { status('Camera isn\'t ready yet — try again in a second.'); return; }
    const crop = cropToFrame(v, fr);
    if (crop.w < 40 || crop.h < 40) { status('Couldn\'t line the card up — try again.'); return; }
    // Upscale the crop so the name and number are big enough to read.
    const up = Math.min(2, 1400 / crop.w);
    const c = document.createElement('canvas');
    c.width = Math.round(crop.w * up);
    c.height = Math.round(crop.h * up);
    c.getContext('2d').drawImage(v, crop.x, crop.y, crop.w, crop.h, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/jpeg', 0.92);
    const pv = document.getElementById('scanPreview');
    if (pv) pv.innerHTML = '<img src="' + dataUrl + '" alt="Scanned card">';
    document.getElementById('scanResults').innerHTML = '';
    closeCamera();
    runOcr(dataUrl);
  };
  document.getElementById('scanOpenCam').addEventListener('click', openCamera);
  document.getElementById('scanCapture').addEventListener('click', captureFrame);
  document.getElementById('scanCloseCam').addEventListener('click', closeCamera);
  document.getElementById('scanTakeSys').addEventListener('click', () => document.getElementById('scanFile').click());
  document.getElementById('scanPick').addEventListener('click', () => document.getElementById('scanFile2').click());
  document.getElementById('scanFile').addEventListener('change', (e) => onFile(e.target.files && e.target.files[0]));
  document.getElementById('scanFile2').addEventListener('change', (e) => onFile(e.target.files && e.target.files[0]));
  document.getElementById('scanManual').addEventListener('input', (e) => {
    const q = e.target.value.trim();
    if (!q) { document.getElementById('scanResults').innerHTML = ''; return; }
    renderScanResults(findMatches(q, null, true), { name: q, num: null });
  });
}

render();
</script>
</body>
</html>
